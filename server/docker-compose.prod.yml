services:
  loophrase-server:
    image: ghcr.io/${REGISTRY_OWNER}/loophrase-server:${APP_VERSION}
    container_name: loophrase-server
    ports:
      - "8100:8000"
    volumes:
      - ./apks:/app/apks
      - ./data:/app/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    restart: unless-stopped
