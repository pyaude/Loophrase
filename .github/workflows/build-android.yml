name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      artifact_name: ${{ steps.version.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ARTIFACT_NAME=Loophrase-v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 生成 debug keystore 用于 release 签名（无需配置 secrets 即可安装）
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore $HOME/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Inject signing config into build.gradle
        run: |
          BUILD_GRADLE=android/app/build.gradle
          # 在 android { } 块中添加 signingConfigs
          sed -i '/^android {/a\
        signingConfigs {\
            release {\
                storeFile file("'"$HOME"'/debug.keystore")\
                storePassword "android"\
                keyAlias "androiddebugkey"\
                keyPassword "android"\
            }\
        }' "$BUILD_GRADLE"
          # release buildType 使用 release signingConfig
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' "$BUILD_GRADLE"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk \
             output/Loophrase-v${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ARTIFACT_NAME }}
          path: output/Loophrase-*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Loophrase-*.apk
