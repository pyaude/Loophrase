name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      artifact_name: ${{ steps.version.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ARTIFACT_NAME=Loophrase-v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Expo prebuild 默认 release buildType 使用 debug 签名（signingConfigs.debug）
      # Gradle 在首次构建时自动生成 debug keystore，无需额外配置
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" output/Loophrase-v${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ARTIFACT_NAME }}
          path: output/Loophrase-*.apk
          retention-days: 30

      - name: Notify DingTalk
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          BUILD_STATUS: ${{ job.status }}
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "DINGTALK_WEBHOOK not set, skipping notification"
            exit 0
          fi

          # 计算签名（钉钉加签验证）
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s%3N)
            STRING_TO_SIGN="$TIMESTAMP\n$DINGTALK_SECRET"
            SIGNATURE=$(printf "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64)
            # URL 编码
            SIGNATURE_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SIGNATURE'))")
            WEBHOOK_URL="${DINGTALK_WEBHOOK}&timestamp=$TIMESTAMP&sign=$SIGNATURE_ENC"
          else
            WEBHOOK_URL="$DINGTALK_WEBHOOK"
          fi

          if [ "$BUILD_STATUS" = "success" ]; then
            TITLE="✅ Loophrase v$APP_VERSION 构建成功"
            ARTIFACT_URL="https://github.com/$REPO_NAME/actions/runs/$RUN_ID"
            TEXT="### ✅ APK 构建成功\n\n**版本：** v$APP_VERSION\n\n[📥 点击下载 APK]($ARTIFACT_URL)\n\n> 在 Actions 页面的 Artifacts 区域下载"
          else
            TITLE="❌ Loophrase 构建失败"
            TEXT="### ❌ APK 构建失败\n\n**状态：** $BUILD_STATUS\n\n[查看日志](https://github.com/$REPO_NAME/actions/runs/$RUN_ID)"
          fi

          curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"$TITLE\",
                \"text\": \"$TEXT\"
              }
            }"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Loophrase-*.apk
