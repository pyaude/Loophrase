name: Build Android APK

on:
  workflow_dispatch:

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      artifact_name: ${{ steps.version.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: version
        working-directory: mobile
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          echo "当前版本: v$OLD_VERSION"

          # 自动递增 patch 版本号
          npm version patch --no-git-tag-version --silent
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "新版本: v$NEW_VERSION"

          # 同步 app.json 中的 version
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '$NEW_VERSION';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          # 提交版本号变更
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app.json
          git commit -m "chore: 升级版本 v$OLD_VERSION → v$NEW_VERSION"
          git push

          echo "APP_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "ARTIFACT_NAME=Loophrase-v$NEW_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: bump-version
    container:
      image: ghcr.io/pyaude/loophrase:android-builder
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    outputs:
      app_version: ${{ needs.bump-version.outputs.app_version }}
      artifact_name: ${{ needs.bump-version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate .env
        working-directory: mobile
        env:
          EXPO_PUBLIC_UPDATE_SERVER_URL: ${{ secrets.EXPO_PUBLIC_UPDATE_SERVER_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_UPDATE_SERVER_URL" ]; then
            echo "::warning::EXPO_PUBLIC_UPDATE_SERVER_URL secret 未配置，更新功能将不可用"
            cat > .env <<'EOF'
          EXPO_PUBLIC_UPDATE_SERVER_URL=
          EXPO_PUBLIC_SUPABASE_URL=
          EXPO_PUBLIC_SUPABASE_ANON_KEY=
          EOF
          else
            cat > .env <<EOF
          EXPO_PUBLIC_UPDATE_SERVER_URL=$EXPO_PUBLIC_UPDATE_SERVER_URL
          EXPO_PUBLIC_SUPABASE_URL=
          EXPO_PUBLIC_SUPABASE_ANON_KEY=
          EOF
          fi
          echo ".env generated:"
          grep -o 'EXPO_PUBLIC_[A-Z_]*=' .env

      - name: Read app version
        id: version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ARTIFACT_NAME=Loophrase-v$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      # 缓存 expo prebuild 生成的 android 目录
      - name: Cache prebuild output
        id: cache-prebuild
        uses: actions/cache@v4
        with:
          path: mobile/android
          key: prebuild-v2-${{ hashFiles('mobile/app.json', 'mobile/app.config.*', 'mobile/package.json', 'mobile/package-lock.json') }}

      - name: Generate native Android project
        working-directory: mobile
        if: steps.cache-prebuild.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Force arm64-only build
        working-directory: mobile
        run: |
          python3 -c "
          import re
          with open('android/gradle.properties', 'r') as f:
              content = f.read()
          content = re.sub(r'reactNativeArchitectures=.*', 'reactNativeArchitectures=arm64-v8a', content)
          if 'reactNativeArchitectures' not in content:
              content += '\nreactNativeArchitectures=arm64-v8a\n'
          with open('android/gradle.properties', 'w') as f:
              f.write(content)
          "
          grep "reactNativeArchitectures" android/gradle.properties

      # Gradle 缓存
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease

      - name: Collect APK
        working-directory: mobile
        run: |
          mkdir -p ../output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" ../output/Loophrase-v${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ARTIFACT_NAME }}
          path: output/Loophrase-*.apk
          retention-days: 30

      - name: Publish to Update Server
        if: success()
        working-directory: .
        env:
          EXPO_PUBLIC_UPDATE_SERVER_URL: ${{ secrets.EXPO_PUBLIC_UPDATE_SERVER_URL }}
          UPDATE_ADMIN_TOKEN: ${{ secrets.UPDATE_ADMIN_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        run: |
          if [ -z "$EXPO_PUBLIC_UPDATE_SERVER_URL" ] || [ -z "$UPDATE_ADMIN_TOKEN" ]; then
            echo "EXPO_PUBLIC_UPDATE_SERVER_URL or UPDATE_ADMIN_TOKEN not set, skipping publish"
            exit 0
          fi

          APK_FILE="output/Loophrase-v${APP_VERSION}.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "APK not found at $APK_FILE, skipping publish"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$EXPO_PUBLIC_UPDATE_SERVER_URL/api/v1/admin/publish" \
            -H "Authorization: Bearer $UPDATE_ADMIN_TOKEN" \
            -F "version=$APP_VERSION" \
            -F "platform=android" \
            -F "changelog=Loophrase v$APP_VERSION" \
            -F "min_required_version=0.0.0" \
            -F "apk=@$APK_FILE")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Published v$APP_VERSION to update server"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "⚠️  Version v$APP_VERSION already exists on server, skipping"
          else
            echo "❌ Publish failed (HTTP $HTTP_CODE): $BODY"
          fi

      - name: Cleanup Gradle daemon
        if: always()
        working-directory: mobile/android
        run: ./gradlew --stop || true

      - name: Notify DingTalk
        if: always()
        working-directory: .
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          BUILD_STATUS: ${{ job.status }}
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "DINGTALK_WEBHOOK not set, skipping notification"
            exit 0
          fi

          # 计算签名（钉钉加签验证）
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s%3N)
            STRING_TO_SIGN="$TIMESTAMP\n$DINGTALK_SECRET"
            SIGNATURE=$(printf "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64)
            SIGNATURE_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SIGNATURE'))")
            WEBHOOK_URL="${DINGTALK_WEBHOOK}&timestamp=$TIMESTAMP&sign=$SIGNATURE_ENC"
          else
            WEBHOOK_URL="$DINGTALK_WEBHOOK"
          fi

          if [ "$BUILD_STATUS" = "success" ]; then
            TITLE="✅ Loophrase v$APP_VERSION 构建成功"
            ARTIFACT_URL="https://github.com/$REPO_NAME/actions/runs/$RUN_ID"
            TEXT="### ✅ APK 构建成功\n\n**版本：** v$APP_VERSION\n\n[📥 点击下载 APK]($ARTIFACT_URL)\n\n> 在 Actions 页面的 Artifacts 区域下载"
          else
            TITLE="❌ Loophrase 构建失败"
            TEXT="### ❌ APK 构建失败\n\n**状态：** $BUILD_STATUS\n\n[查看日志](https://github.com/$REPO_NAME/actions/runs/$RUN_ID)"
          fi

          curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"$TITLE\",
                \"text\": \"$TEXT\"
              }
            }"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Loophrase-*.apk
